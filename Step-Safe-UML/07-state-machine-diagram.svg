<svg xmlns="http://www.w3.org/2000/svg"
     width="1640"
     height="1820"
     viewBox="0 0 1640 1820">

  <!-- =====================================================
       DEFINITIONS & STYLES
       ===================================================== -->
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #475569; text-anchor: middle; }
      .state-box { rx: 14px; stroke-width: 2; }
      .state-header { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .state-action { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; fill: #1e293b; }
      .state-action-kw { font-weight: bold; fill: #0f172a; }
      .trans-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; }
      .guard-label { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; fill: #047857; }
      .action-label { font-family: 'Consolas', monospace; font-size: 11px; font-style: italic; fill: #1d4ed8; }
      .trans-line { stroke: #334155; stroke-width: 1.8; fill: none; }
      .alert-line { stroke: #dc2626; stroke-width: 2; fill: none; }
      .reset-line { stroke: #16a34a; stroke-width: 2; fill: none; }
      .note-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #854d0e; }
    </style>

    <marker id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="9"
            refY="5"
            orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#334155"/>
    </marker>

    <marker id="alertArrow"
            markerWidth="10"
            markerHeight="10"
            refX="9"
            refY="5"
            orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#dc2626"/>
    </marker>

    <marker id="greenArrow"
            markerWidth="10"
            markerHeight="10"
            refX="9"
            refY="5"
            orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1640" height="1820" fill="#ffffff"/>

  <!-- Titles -->
  <text x="820" y="42" class="title">STEP-SAFE — STATE MACHINE DIAGRAM</text>
  <text x="820" y="68" class="subtitle">Complete Lifecycle: Calibration (20 Samples), Continuous Monitoring, 30s Sustained-Pressure Rule, and Escalation States</text>

  <!-- =====================================================
       INITIAL NODE
       ===================================================== -->
  <circle cx="820" cy="115" r="16" fill="#0f172a"/>
  <line x1="820" y1="131" x2="820" y2="165" class="trans-line" marker-end="url(#arrow)"/>
  <text x="830" y="152" class="trans-label">Power On</text>

  <!-- =====================================================
       STATE 1: System Start
       ===================================================== -->
  <g id="state-SystemStart" transform="translate(640, 165)">
    <rect width="360" height="95" rx="12" fill="#f8fafc" stroke="#334155" class="state-box"/>
    <line x1="0" y1="36" x2="360" y2="36" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="180" y="24" class="state-header">System Start</text>
    <!-- Internal actions -->
    <text x="15" y="54" class="state-action"><tspan class="state-action-kw">entry /</tspan> initHardware(); setBuzzer(GPIO25, LOW);</text>
    <text x="15" y="72" class="state-action"><tspan class="state-action-kw">do /</tspan> startSoftAP("STEP-SAFE", "192.168.4.1");</text>
    <text x="15" y="88" class="state-action"><tspan class="state-action-kw">exit /</tspan> confirmNetworkReady();</text>
  </g>

  <!-- Transition: Start -> Waiting -->
  <line x1="820" y1="260" x2="820" y2="310" class="trans-line" marker-end="url(#arrow)"/>
  <text x="830" y="290" class="trans-label">Wi-Fi AP Online &amp; Backend Listening :5000</text>

  <!-- =====================================================
       STATE 2: Waiting for Login/Calibration
       ===================================================== -->
  <g id="state-Waiting" transform="translate(615, 310)">
    <rect width="410" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" class="state-box"/>
    <line x1="0" y1="36" x2="410" y2="36" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="205" y="24" class="state-header" fill="#1e40af">Waiting for Login / Calibration</text>
    <!-- Internal actions -->
    <text x="15" y="54" class="state-action"><tspan class="state-action-kw">entry /</tspan> displayIdlePrompt(); awaitUserAuth();</text>
    <text x="15" y="72" class="state-action"><tspan class="state-action-kw">do /</tspan> listenForSessionToken(); serveDashboard();</text>
    <text x="15" y="90" class="state-action"><tspan class="state-action-kw">exit /</tspan> authenticateUser(role);</text>
  </g>

  <!-- Transition: Waiting -> Calibrating -->
  <line x1="820" y1="410" x2="820" y2="465" class="trans-line" marker-end="url(#arrow)"/>
  <text x="830" y="435" class="trans-label">User clicks "Start Calibration" [POST /api/calibrate]</text>
  <text x="830" y="452" class="action-label">/ initSampleBuffer(size=20)</text>

  <!-- =====================================================
       STATE 3: Calibrating
       ===================================================== -->
  <g id="state-Calibrating" transform="translate(585, 465)">
    <rect width="470" height="120" rx="12" fill="#eff6ff" stroke="#1d4ed8" class="state-box"/>
    <line x1="0" y1="36" x2="470" y2="36" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="235" y="24" class="state-header" fill="#1e40af">Calibrating</text>
    <!-- Internal actions -->
    <text x="15" y="54" class="state-action"><tspan class="state-action-kw">entry /</tspan> sampleCount = 0; displayCalibratingUI();</text>
    <text x="15" y="72" class="state-action"><tspan class="state-action-kw">do /</tspan> collect 20 readings from FSR (GPIO34) &amp; LM35 (GPIO35);</text>
    <text x="15" y="90" class="state-action"><tspan class="state-action-kw">exit /</tspan> computeBaselines();</text>
    <text x="15" y="106" class="state-action">       saveThresholds(FSR_thr=base+20% [>=100], Temp_thr=base+2°C);</text>
  </g>

  <!-- Transition: Calibrating -> Normal Monitoring -->
  <line x1="820" y1="585" x2="820" y2="650" class="trans-line" marker-end="url(#arrow)"/>
  <text x="830" y="612" class="trans-label">Calibration Complete [sampleCount == 20]</text>
  <text x="830" y="630" class="action-label">/ commitThresholdsToSQLite(); renderDashboardThresholds();</text>

  <!-- =====================================================
       STATE 4: Normal Monitoring
       ===================================================== -->
  <g id="state-NormalMonitoring" transform="translate(570, 650)">
    <rect width="500" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" class="state-box"/>
    <line x1="0" y1="36" x2="500" y2="36" stroke="#bbf7d0" stroke-width="1.2"/>
    <text x="250" y="24" class="state-header" fill="#15803d">Normal Monitoring</text>
    <!-- Internal actions -->
    <text x="15" y="54" class="state-action"><tspan class="state-action-kw">entry /</tspan> timerSec = 0; setBuzzer(GPIO25, LOW); status = "NORMAL";</text>
    <text x="15" y="72" class="state-action"><tspan class="state-action-kw">do /</tspan> pollSensors(GPIO34, GPIO35); HTTP POST /api/readings;</text>
    <text x="15" y="90" class="state-action">     updateLiveCharts(); refreshSummaryMetrics();</text>
    <text x="15" y="108" class="state-action"><tspan class="state-action-kw">exit /</tspan> recordTransitionTimestamp();</text>
  </g>

  <!-- Transition: Normal -> Pressure Detected -->
  <line x1="820" y1="770" x2="820" y2="835" class="trans-line" marker-end="url(#arrow)"/>
  <text x="830" y="798" class="trans-label">Foot Stance Applied</text>
  <text x="830" y="816" class="guard-label">[FSR Reading &gt;= FSR Threshold] <tspan class="action-label">/ startLocalTimer()</tspan></text>

  <!-- =====================================================
       STATE 5: Pressure Detected
       ===================================================== -->
  <g id="state-PressureDetected" transform="translate(570, 835)">
    <rect width="500" height="125" rx="12" fill="#fffbeb" stroke="#d97706" class="state-box"/>
    <line x1="0" y1="36" x2="500" y2="36" stroke="#fde68a" stroke-width="1.2"/>
    <text x="250" y="24" class="state-header" fill="#92400e">Pressure Detected</text>
    <!-- Internal actions -->
    <text x="15" y="54" class="state-action"><tspan class="state-action-kw">entry /</tspan> status = "PRESSURE"; buzzer = OFF;</text>
    <text x="15" y="72" class="state-action"><tspan class="state-action-kw">do /</tspan> incrementTimer(t = t + dt);</text>
    <text x="15" y="90" class="state-action">     updateDashboardProgressBar(t, max=30s);</text>
    <text x="15" y="108" class="state-action"><tspan class="state-action-kw">exit /</tspan> logPressureDuration();</text>
  </g>

  <!-- Self/Early Release Transition: Pressure Detected -> Normal Monitoring -->
  <path d="M 570 885 L 440 885 L 440 710 L 570 710" class="reset-line" marker-end="url(#greenArrow)"/>
  <text x="350" y="780" class="guard-label" text-anchor="middle">[Pressure &lt; Threshold before 30s]</text>
  <text x="350" y="800" class="action-label" text-anchor="middle">/ resetTimer(0); status = "NORMAL"</text>

  <!-- Split Transitions from Pressure Detected (at t >= 30s): -->
  <!-- Left branch -> High Pressure (Normal Temp) -->
  <!-- Right branch -> High Risk (Elevated Temp) -->
  <path d="M 700 960 L 700 1010 L 450 1010 L 450 1055" class="alert-line" marker-end="url(#alertArrow)"/>
  <text x="440" y="990" class="guard-label" text-anchor="middle">[Timer &gt;= 30s AND Temp &lt; Temp_Thr]</text>
  <text x="440" y="1005" class="action-label" text-anchor="middle">(Normal Temperature)</text>

  <path d="M 940 960 L 940 1010 L 1180 1010 L 1180 1055" class="alert-line" marker-end="url(#alertArrow)"/>
  <text x="1200" y="990" class="guard-label" text-anchor="middle">[Timer &gt;= 30s AND Temp &gt;= Temp_Thr]</text>
  <text x="1200" y="1005" class="action-label" text-anchor="middle">(Elevated Temperature &gt;= Base+2°C)</text>

  <!-- =====================================================
       STATE 6: High Pressure
       ===================================================== -->
  <g id="state-HighPressure" transform="translate(230, 1055)">
    <rect width="450" height="125" rx="12" fill="#fef2f2" stroke="#dc2626" class="state-box"/>
    <line x1="0" y1="36" x2="450" y2="36" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="225" y="24" class="state-header" fill="#991b1b">High Pressure</text>
    <!-- Internal actions -->
    <text x="15" y="54" class="state-action"><tspan class="state-action-kw">entry /</tspan> digitalWrite(GPIO25, HIGH) [Buzzer ON];</text>
    <text x="15" y="72" class="state-action">       status = "HIGH PRESSURE"; createAlertRecord();</text>
    <text x="15" y="90" class="state-action"><tspan class="state-action-kw">do /</tspan> soundPiezoAlarm(); flashDashboardAlertBanner();</text>
    <text x="15" y="108" class="state-action"><tspan class="state-action-kw">exit /</tspan> recordAlertEnd();</text>
  </g>

  <!-- =====================================================
       STATE 7: High Risk
       ===================================================== -->
  <g id="state-HighRisk" transform="translate(950, 1055)">
    <rect width="460" height="125" rx="12" fill="#fff1f2" stroke="#be123c" class="state-box"/>
    <line x1="0" y1="36" x2="460" y2="36" stroke="#fda4af" stroke-width="1.2"/>
    <text x="230" y="24" class="state-header" fill="#9f1239">High Risk</text>
    <!-- Internal actions -->
    <text x="15" y="54" class="state-action"><tspan class="state-action-kw">entry /</tspan> digitalWrite(GPIO25, HIGH) [Buzzer ON];</text>
    <text x="15" y="72" class="state-action">       status = "HIGH RISK"; createCriticalAlert();</text>
    <text x="15" y="90" class="state-action"><tspan class="state-action-kw">do /</tspan> soundContinuousAlarm(); triggerUrgentAudioTone();</text>
    <text x="15" y="108" class="state-action"><tspan class="state-action-kw">exit /</tspan> logCriticalResolved();</text>
  </g>

  <!-- Both High Pressure & High Risk transition into State 8: Alert Sent -->
  <path d="M 455 1180 L 455 1240 L 740 1240 L 740 1275" class="alert-line" marker-end="url(#alertArrow)"/>
  <path d="M 1180 1180 L 1180 1240 L 900 1240 L 900 1275" class="alert-line" marker-end="url(#alertArrow)"/>
  <text x="820" y="1232" class="trans-label" text-anchor="middle">Dispatched to Mobile Notification Service (Firebase / APNs)</text>

  <!-- =====================================================
       STATE 8: Alert Sent
       ===================================================== -->
  <g id="state-AlertSent" transform="translate(540, 1275)">
    <rect width="560" height="145" rx="12" fill="#faf5ff" stroke="#7c3aed" class="state-box"/>
    <line x1="0" y1="36" x2="560" y2="36" stroke="#ddd6fe" stroke-width="1.2"/>
    <text x="280" y="24" class="state-header" fill="#5b21b6">Alert Sent</text>
    <!-- Internal actions -->
    <text x="15" y="54" class="state-action"><tspan class="state-action-kw">entry /</tspan> dispatchPushNotification("Patient: Sustained High Pressure");</text>
    <text x="15" y="72" class="state-action">       dispatchPushNotification("Caregiver: Alert on Patient01");</text>
    <text x="15" y="90" class="state-action">       INSERT INTO notifications (alert_id, status='SENT');</text>
    <text x="15" y="108" class="state-action"><tspan class="state-action-kw">do /</tspan> maintainBuzzerAlarm(); awaitPatientFootRelief();</text>
    <text x="15" y="126" class="state-action"><tspan class="state-action-kw">exit /</tspan> acknowledgeAlertDelivery();</text>
  </g>

  <!-- Transition: Alert Sent -> Normal Reset -->
  <line x1="820" y1="1420" x2="820" y2="1495" class="reset-line" marker-end="url(#greenArrow)"/>
  <text x="830" y="1450" class="trans-label" fill="#15803d">Foot Pressure Relieved</text>
  <text x="830" y="1468" class="guard-label">[FSR Reading &lt; FSR Threshold]</text>
  <text x="830" y="1484" class="action-label">/ digitalWrite(GPIO25, LOW) [Buzzer OFF]</text>

  <!-- =====================================================
       STATE 9: Normal Reset
       ===================================================== -->
  <g id="state-NormalReset" transform="translate(560, 1495)">
    <rect width="520" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" class="state-box"/>
    <line x1="0" y1="36" x2="520" y2="36" stroke="#bbf7d0" stroke-width="1.2"/>
    <text x="260" y="24" class="state-header" fill="#15803d">Normal Reset</text>
    <!-- Internal actions -->
    <text x="15" y="54" class="state-action"><tspan class="state-action-kw">entry /</tspan> timerSec = 0; buzzer = OFF; clearAlertBanner();</text>
    <text x="15" y="72" class="state-action">       logReliefEventInSQLite();</text>
    <text x="15" y="90" class="state-action"><tspan class="state-action-kw">do /</tspan> verifySensorsNormal(); updateDashboardStatus("NORMAL");</text>
    <text x="15" y="108" class="state-action"><tspan class="state-action-kw">exit /</tspan> restoreBaselineMonitoringMode();</text>
  </g>

  <!-- Loop back from Normal Reset to Normal Monitoring -->
  <path d="M 1080 1555 L 1480 1555 L 1480 710 L 1070 710" class="reset-line" marker-end="url(#greenArrow)"/>
  <text x="1490" y="1130" class="guard-label" transform="rotate(90 1490 1130)" text-anchor="middle">
    Resume Continuous Polling [Safe Baseline Restored]
  </text>

  <!-- Optional Shutdown / Exit Path from Normal Monitoring -->
  <path d="M 1070 680 L 1260 680 L 1260 770" class="trans-line" marker-end="url(#arrow)"/>
  <text x="1270" y="720" class="trans-label">Session End / Logout</text>

  <!-- Final State (Bullseye) -->
  <circle cx="1260" cy="795" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="1260" cy="795" r="10" fill="#0f172a"/>

  <!-- =====================================================
       DIAGRAM LEGEND
       ===================================================== -->
  <g transform="translate(60, 1660)">
    <rect width="1520" height="125" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="25" y="25" font-family="'Segoe UI', Arial" font-size="13" font-weight="bold" fill="#0f172a">STATE TRANSITION LOGIC SPECIFICATION:</text>

    <text x="25" y="48" font-family="'Segoe UI', Arial" font-size="12" fill="#334155">
      1. <tspan font-weight="bold">Calibrating:</tspan> 20 samples taken at rest. FSR Baseline computed; FSR Threshold = Baseline + 20% (min 100). Temp Baseline computed; Temp Threshold = Baseline + 2°C.
    </text>
    <text x="25" y="68" font-family="'Segoe UI', Arial" font-size="12" fill="#334155">
      2. <tspan font-weight="bold">Pressure Detected:</tspan> Timer runs while FSR >= Threshold. If released under 30s, timer resets to 0 and system returns to Normal Monitoring without buzzer.
    </text>
    <text x="25" y="88" font-family="'Segoe UI', Arial" font-size="12" fill="#334155">
      3. <tspan font-weight="bold">High Pressure vs High Risk:</tspan> After 30s sustained pressure: if Temperature is normal =&gt; HIGH PRESSURE (Buzzer ON on GPIO25); if Temperature &gt;= Threshold =&gt; HIGH RISK (Buzzer ON).
    </text>
    <text x="25" y="108" font-family="'Segoe UI', Arial" font-size="12" fill="#334155">
      4. <tspan font-weight="bold">Alert Sent &amp; Normal Reset:</tspan> Mobile notifications dispatched to Patient and Caregiver profiles. When pressure is released, buzzer turns OFF and state transitions to Normal Reset.
    </text>
  </g>

</svg>