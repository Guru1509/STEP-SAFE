<svg xmlns="http://www.w3.org/2000/svg"
     width="1800"
     height="1280"
     viewBox="0 0 1800 1280">

  <!-- =====================================================
       DEFINITIONS & STYLES
       ===================================================== -->
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #475569; text-anchor: middle; }
      .participant-box { rx: 8px; stroke-width: 2px; }
      .part-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .part-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .lifeline { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6,4; }
      .msg-line { stroke: #1e293b; stroke-width: 1.8; fill: none; }
      .reply-line { stroke: #475569; stroke-width: 1.6; stroke-dasharray: 5,4; fill: none; }
      .alert-msg-line { stroke: #dc2626; stroke-width: 2; fill: none; }
      .notif-msg-line { stroke: #7c3aed; stroke-width: 2; fill: none; }
      .msg-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; }
      .reply-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; font-style: italic; }
      .frame-border { fill: none; stroke: #64748b; stroke-width: 1.5; }
      .frame-tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1e293b; }
      .note-box { fill: #fef9c3; stroke: #ca8a04; stroke-width: 1.2; rx: 4px; }
      .note-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #854d0e; }
    </style>

    <!-- Filled arrow for synchronous message -->
    <marker id="syncArrow"
            markerWidth="10"
            markerHeight="10"
            refX="9"
            refY="5"
            orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#1e293b"/>
    </marker>

    <!-- Open arrow for return message -->
    <marker id="replyArrow"
            markerWidth="10"
            markerHeight="10"
            refX="9"
            refY="5"
            orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#475569" stroke-width="1.6"/>
    </marker>

    <!-- Red arrow for alert message -->
    <marker id="alertArrow"
            markerWidth="10"
            markerHeight="10"
            refX="9"
            refY="5"
            orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#dc2626"/>
    </marker>

    <!-- Purple arrow for notification service -->
    <marker id="notifArrow"
            markerWidth="10"
            markerHeight="10"
            refX="9"
            refY="5"
            orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1800" height="1280" fill="#ffffff"/>

  <!-- Diagram Titles -->
  <text x="900" y="40" class="title">STEP-SAFE — SEQUENCE DIAGRAM</text>
  <text x="900" y="66" class="subtitle">End-to-End Monitoring: Calibration (20 Samples), Continuous Telemetry, 30s Sustained Pressure Buzzer &amp; Mobile Alerts</text>

  <!-- =====================================================
       LIFELINES & PARTICIPANT HEADERS
       X coordinates:
       Patient: 100
       Dashboard: 290
       Flask: 510
       SQLite: 730
       ESP32: 950
       Buzzer: 1150
       AlertSvc: 1330
       NotifSvc: 1530
       Caregiver: 1710
       ===================================================== -->

  <!-- Lifeline dashed lines -->
  <line x1="100" y1="140" x2="100" y2="1240" class="lifeline"/>
  <line x1="290" y1="140" x2="290" y2="1240" class="lifeline"/>
  <line x1="510" y1="140" x2="510" y2="1240" class="lifeline"/>
  <line x1="730" y1="140" x2="730" y2="1240" class="lifeline"/>
  <line x1="950" y1="140" x2="950" y2="1240" class="lifeline"/>
  <line x1="1150" y1="140" x2="1150" y2="1240" class="lifeline"/>
  <line x1="1330" y1="140" x2="1330" y2="1240" class="lifeline"/>
  <line x1="1530" y1="140" x2="1530" y2="1240" class="lifeline" stroke="#7c3aed"/>
  <line x1="1710" y1="140" x2="1710" y2="1240" class="lifeline"/>

  <!-- 1. Patient -->
  <g transform="translate(25, 90)">
    <rect width="150" height="50" fill="#f8fafc" stroke="#334155" class="participant-box"/>
    <text x="75" y="22" class="part-title">Patient / User</text>
    <text x="75" y="38" class="part-sub">«actor»</text>
  </g>

  <!-- 2. Dashboard -->
  <g transform="translate(215, 90)">
    <rect width="150" height="50" fill="#eff6ff" stroke="#2563eb" class="participant-box"/>
    <text x="75" y="22" class="part-title">Dashboard</text>
    <text x="75" y="38" class="part-sub">:WebDashboard</text>
  </g>

  <!-- 3. Flask Backend -->
  <g transform="translate(435, 90)">
    <rect width="150" height="50" fill="#eff6ff" stroke="#1d4ed8" class="participant-box"/>
    <text x="75" y="22" class="part-title">Flask Backend</text>
    <text x="75" y="38" class="part-sub">MacBook :5000</text>
  </g>

  <!-- 4. SQLite -->
  <g transform="translate(655, 90)">
    <rect width="150" height="50" fill="#f8fafc" stroke="#475569" class="participant-box"/>
    <text x="75" y="22" class="part-title">SQLite DB</text>
    <text x="75" y="38" class="part-sub">step_safe.db</text>
  </g>

  <!-- 5. ESP32 -->
  <g transform="translate(875, 90)">
    <rect width="150" height="50" fill="#f0fdf4" stroke="#16a34a" class="participant-box"/>
    <text x="75" y="22" class="part-title">ESP32 Device</text>
    <text x="75" y="38" class="part-sub">192.168.4.1 SoftAP</text>
  </g>

  <!-- 6. Buzzer -->
  <g transform="translate(1085, 90)">
    <rect width="130" height="50" fill="#fef2f2" stroke="#dc2626" class="participant-box"/>
    <text x="65" y="22" class="part-title">Buzzer</text>
    <text x="65" y="38" class="part-sub">GPIO25 Alert</text>
  </g>

  <!-- 7. Alert Service -->
  <g transform="translate(1255, 90)">
    <rect width="150" height="50" fill="#fee2e2" stroke="#dc2626" class="participant-box"/>
    <text x="75" y="22" class="part-title">Alert Service</text>
    <text x="75" y="38" class="part-sub">:AlertManager</text>
  </g>

  <!-- 8. Mobile Notification Service -->
  <g transform="translate(1445, 90)">
    <rect width="170" height="50" fill="#faf5ff" stroke="#7c3aed" class="participant-box"/>
    <text x="85" y="20" class="part-title" fill="#6d28d9">Notif. Service</text>
    <text x="85" y="38" class="part-sub" fill="#7c3aed">Firebase / APNs API</text>
  </g>

  <!-- 9. Caregiver -->
  <g transform="translate(1635, 90)">
    <rect width="150" height="50" fill="#f8fafc" stroke="#334155" class="participant-box"/>
    <text x="75" y="22" class="part-title">Caregiver</text>
    <text x="75" y="38" class="part-sub">«actor» Mobile Profile</text>
  </g>

  <!-- =====================================================
       PHASE 1: AUTHENTICATION & START CALIBRATION
       y: 170 to 330
       ===================================================== -->
  <rect x="50" y="160" width="1720" height="150" fill="#f8fafc" opacity="0.6" stroke="#e2e8f0" rx="6"/>
  <text x="65" y="180" class="frame-tag" fill="#2563eb">PHASE 1: AUTHENTICATION &amp; CALIBRATION REQUEST</text>

  <!-- 1. Patient -> Dashboard: login -->
  <line x1="100" y1="200" x2="290" y2="200" class="msg-line" marker-end="url(#syncArrow)"/>
  <text x="195" y="194" class="msg-text" text-anchor="middle">1: login(username, password)</text>

  <!-- 2. Dashboard -> Flask: authenticate -->
  <line x1="290" y1="220" x2="510" y2="220" class="msg-line" marker-end="url(#syncArrow)"/>
  <text x="400" y="214" class="msg-text" text-anchor="middle">2: POST /auth/login</text>

  <!-- 3. Flask -> SQLite: query user -->
  <line x1="510" y1="240" x2="730" y2="240" class="msg-line" marker-end="url(#syncArrow)"/>
  <text x="620" y="234" class="msg-text" text-anchor="middle">3: SELECT user, profile</text>

  <!-- 4. SQLite -> Flask: user profile -->
  <line x1="730" y1="260" x2="510" y2="260" class="reply-line" marker-end="url(#replyArrow)"/>
  <text x="620" y="254" class="reply-text" text-anchor="middle">4: UserProfile record</text>

  <!-- 5. Flask -> Dashboard: session OK -->
  <line x1="510" y1="275" x2="290" y2="275" class="reply-line" marker-end="url(#replyArrow)"/>
  <text x="400" y="269" class="reply-text" text-anchor="middle">5: 200 OK (session token)</text>

  <!-- 6. Patient -> Dashboard: start calibration -->
  <line x1="100" y1="295" x2="290" y2="295" class="msg-line" marker-end="url(#syncArrow)"/>
  <text x="195" y="289" class="msg-text" text-anchor="middle">6: click "Start Calibration"</text>

  <!-- 7. Dashboard -> Flask: request calibration -->
  <line x1="290" y1="305" x2="510" y2="305" class="msg-line" marker-end="url(#syncArrow)"/>
  <text x="400" y="299" class="msg-text" text-anchor="middle">7: POST /api/calibrate</text>

  <!-- =====================================================
       PHASE 2: 20-SAMPLE SENSOR CALIBRATION
       y: 330 to 520
       ===================================================== -->
  <rect x="50" y="325" width="1720" height="195" fill="#ffffff" stroke="#cbd5e1" class="frame-border" rx="6"/>
  <polygon points="50,325 180,325 190,345 50,345" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="60" y="340" class="frame-tag">loop [20 Samples]</text>

  <!-- Note: 20 readings -->
  <rect x="970" y="340" width="280" height="35" class="note-box"/>
  <text x="980" y="355" class="note-text">ESP32 samples FSR (GPIO34) &amp;</text>
  <text x="980" y="369" class="note-text">LM35 (GPIO35) during zero-load rest</text>

  <!-- 8. ESP32 -> Flask: continuous calibration readings -->
  <line x1="950" y1="390" x2="510" y2="390" class="msg-line" marker-end="url(#syncArrow)"/>
  <text x="730" y="384" class="msg-text" text-anchor="middle">8: HTTP POST /api/readings {"device_id":"step-safe-esp32", "fsr":150, "temperature":32.5} [1..20]</text>

  <!-- Flask self-call: calculate -->
  <path d="M 510 410 L 550 410 L 550 435 L 510 435" class="msg-line" marker-end="url(#syncArrow)"/>
  <text x="560" y="425" class="msg-text">9: computeBaselinesAndThresholds()</text>
  <text x="560" y="440" font-family="'Segoe UI', Arial" font-size="11" fill="#1e40af">FSR Thr = Base+20% (min 100) | Temp Thr = Base+2°C</text>

  <!-- 10. Flask -> SQLite: save calibration -->
  <line x1="510" y1="465" x2="730" y2="465" class="msg-line" marker-end="url(#syncArrow)"/>
  <text x="620" y="459" class="msg-text" text-anchor="middle">10: saveCalibration(baselines, thresholds)</text>

  <!-- 11. Flask -> Dashboard: notify calibration complete -->
  <line x1="510" y1="495" x2="290" y2="495" class="reply-line" marker-end="url(#replyArrow)"/>
  <text x="400" y="489" class="reply-text" text-anchor="middle">11: 200 OK {calibrated: true, baselines, thresholds}</text>

  <!-- Dashboard updates UI -->
  <line x1="290" y1="510" x2="100" y2="510" class="reply-line" marker-end="url(#replyArrow)"/>
  <text x="195" y="504" class="reply-text" text-anchor="middle">12: render baseline/threshold display</text>

  <!-- =====================================================
       PHASE 3: CONTINUOUS MONITORING & TELEMETRY STREAM
       y: 535 to 680
       ===================================================== -->
  <rect x="50" y="530" width="1720" height="150" fill="#f8fafc" opacity="0.6" stroke="#e2e8f0" rx="6"/>
  <text x="65" y="550" class="frame-tag" fill="#16a34a">PHASE 3: CONTINUOUS MONITORING &amp; LIVE DASHBOARD</text>

  <!-- 13. ESP32 -> Flask: sensor readings (only device_id, fsr, temperature) -->
  <line x1="950" y1="575" x2="510" y2="575" class="msg-line" marker-end="url(#syncArrow)"/>
  <text x="730" y="569" class="msg-text" text-anchor="middle">13: HTTP POST /api/readings {"device_id":"step-safe-esp32", "fsr":680, "temperature":33.0}</text>

  <!-- Flask calculates status and pressure_seconds internally -->
  <path d="M 510 590 L 550 590 L 550 610 L 510 610" class="msg-line" marker-end="url(#syncArrow)"/>
  <text x="560" y="604" class="msg-text" fill="#1e40af">14: calculate status &amp; duration from readings</text>

  <!-- 15. Flask -> SQLite: insert reading -->
  <line x1="510" y1="625" x2="730" y2="625" class="msg-line" marker-end="url(#syncArrow)"/>
  <text x="620" y="619" class="msg-text" text-anchor="middle">15: INSERT INTO readings (device_id, fsr, temp, status, pressure_seconds)</text>

  <!-- 16. Dashboard -> Flask: poll live -->
  <line x1="290" y1="645" x2="510" y2="645" class="msg-line" marker-end="url(#syncArrow)"/>
  <text x="400" y="639" class="msg-text" text-anchor="middle">16: GET /api/live (fetches calculated status &amp; timer)</text>

  <!-- 17. Flask -> Dashboard: return live values -->
  <line x1="510" y1="660" x2="290" y2="660" class="reply-line" marker-end="url(#replyArrow)"/>
  <text x="400" y="654" class="reply-text" text-anchor="middle">17: JSON {reading: {fsr, temp, status, pressure_seconds}}</text>

  <!-- 18. Dashboard -> Patient: display live telemetry -->
  <line x1="290" y1="675" x2="100" y2="675" class="reply-line" marker-end="url(#replyArrow)"/>
  <text x="195" y="669" class="reply-text" text-anchor="middle">18: update custom SVG charts, gauges, timer</text>

  <!-- =====================================================
       PHASE 4: 30-SECOND SUSTAINED HIGH PRESSURE & ALERT
       y: 695 to 1050
       ===================================================== -->
  <rect x="50" y="690" width="1720" height="360" fill="#fff5f5" stroke="#dc2626" stroke-width="1.8" rx="6"/>
  <polygon points="50,690 320,690 335,712 50,712" fill="#fee2e2" stroke="#dc2626"/>
  <text x="60" y="706" class="frame-tag" fill="#991b1b">CRITICAL EVENT: Sustained Pressure &gt;= 30 Seconds</text>

  <!-- Note: Sustained Pressure Condition -->
  <rect x="360" y="700" width="460" height="42" class="note-box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="370" y="716" class="note-text" fill="#991b1b" font-weight="bold">CONDITION: Pressure &gt; Threshold for 30 consecutive seconds</text>
  <text x="370" y="732" class="note-text" fill="#b91c1c">If Temp &gt;= Base+2°C =&gt; HIGH RISK | Else =&gt; HIGH PRESSURE</text>

  <!-- 19. ESP32 -> Buzzer: activate buzzer on GPIO25 (local detection) -->
  <line x1="950" y1="765" x2="1150" y2="765" class="alert-msg-line" marker-end="url(#alertArrow)"/>
  <text x="1050" y="757" class="msg-text" fill="#dc2626" text-anchor="middle">19: digitalWrite(GPIO25, HIGH) [BUZZER ON - 30s Sustained]</text>

  <!-- 20. ESP32 -> Flask: sensor readings (only device_id, fsr, temp) -->
  <line x1="950" y1="795" x2="510" y2="795" class="alert-msg-line" marker-end="url(#alertArrow)"/>
  <text x="730" y="787" class="msg-text" fill="#dc2626" text-anchor="middle">20: HTTP POST /api/readings {"device_id":"step-safe-esp32", "fsr":680, "temperature":33.0}</text>

  <!-- Flask self-evaluates: status_for() returns HIGH_PRESSURE, duration=30 -->
  <path d="M 510 810 L 550 810 L 550 830 L 510 830" class="alert-msg-line" marker-end="url(#alertArrow)"/>
  <text x="560" y="824" class="msg-text" fill="#dc2626">21: Flask status_for() calculates HIGH_PRESSURE (duration &gt;= 30s)</text>

  <!-- 22. Flask -> Alert Service: create alert -->
  <line x1="510" y1="845" x2="1330" y2="845" class="alert-msg-line" marker-end="url(#alertArrow)"/>
  <text x="920" y="837" class="msg-text" fill="#dc2626" text-anchor="middle">22: createAlert(patientId, deviceId, "HIGH PRESSURE", duration=30s)</text>

  <!-- 23. Alert Service -> SQLite: store event -->
  <line x1="1330" y1="875" x2="730" y2="875" class="msg-line" marker-end="url(#syncArrow)"/>
  <text x="1030" y="867" class="msg-text" text-anchor="middle">23: INSERT INTO events (device_id, event_type, peak_fsr, peak_temp, started_at)</text>

  <!-- 24. Alert Service -> Mobile Notification Service: API call -->
  <line x1="1330" y1="905" x2="1530" y2="905" class="notif-msg-line" marker-end="url(#notifArrow)"/>
  <text x="1430" y="897" class="msg-text" fill="#7c3aed" text-anchor="middle">24: sendMobileAlert(payload) [Firebase / APNs API]</text>

  <!-- 25. Notification Service -> Patient: push alert -->
  <path d="M 1530 935 L 100 935" class="notif-msg-line" marker-end="url(#notifArrow)"/>
  <text x="815" y="927" class="msg-text" fill="#7c3aed" text-anchor="middle">25: pushNotification("Sustained High Foot Pressure Detected (32s). Please check the STEP-SAFE dashboard.")</text>

  <!-- 26. Notification Service -> Caregiver: push alert -->
  <line x1="1530" y1="965" x2="1710" y2="965" class="notif-msg-line" marker-end="url(#notifArrow)"/>
  <text x="1620" y="957" class="msg-text" fill="#7c3aed" text-anchor="middle">26: pushNotification("Patient Alert: High Pressure")</text>

  <!-- 27. Dashboard polls /api/live and receives alert state -->
  <line x1="290" y1="995" x2="510" y2="995" class="alert-msg-line" marker-end="url(#alertArrow)"/>
  <text x="400" y="987" class="msg-text" fill="#dc2626" text-anchor="middle">27: GET /api/live =&gt; {status: "HIGH_PRESSURE", pressure_seconds: 32}</text>

  <!-- 28. Dashboard updates UI with alert banner & audio tone -->
  <line x1="290" y1="1020" x2="100" y2="1020" class="reply-line" marker-end="url(#replyArrow)"/>
  <text x="195" y="1014" class="reply-text" text-anchor="middle">28: render alert banner &amp; play audio tone</text>

  <!-- Caregiver views mobile dashboard -->
  <path d="M 1710 1035 L 290 1035" class="msg-line" stroke="#2563eb" marker-end="url(#syncArrow)"/>
  <text x="1000" y="1029" class="msg-text" fill="#1d4ed8" text-anchor="middle">29: openMobileDashboard() &amp; view alert telemetry and event history</text>

  <!-- =====================================================
       PHASE 5: RECOVERY / PRESSURE REMOVED
       y: 1070 to 1220
       ===================================================== -->
  <rect x="50" y="1065" width="1720" height="155" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="6"/>
  <polygon points="50,1065 240,1065 255,1087 50,1087" fill="#dcfce7" stroke="#16a34a"/>
  <text x="60" y="1081" class="frame-tag" fill="#15803d">RECOVERY: Foot Pressure Relieved</text>

  <!-- Note: foot released -->
  <rect x="280" y="1075" width="380" height="30" class="note-box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="290" y="1094" class="note-text" fill="#166534">Patient lifts foot =&gt; FSR drops below threshold</text>

  <!-- 30. ESP32 -> Buzzer: deactivate buzzer on GPIO25 -->
  <line x1="950" y1="1125" x2="1150" y2="1125" class="msg-line" stroke="#16a34a" marker-end="url(#syncArrow)"/>
  <text x="1050" y="1117" class="msg-text" fill="#16a34a" text-anchor="middle">30: digitalWrite(GPIO25, LOW) [BUZZER OFF]</text>

  <!-- 31. ESP32 -> Flask: normal telemetry (only device_id, fsr, temp) -->
  <line x1="950" y1="1155" x2="510" y2="1155" class="msg-line" stroke="#16a34a" marker-end="url(#syncArrow)"/>
  <text x="730" y="1147" class="msg-text" fill="#16a34a" text-anchor="middle">31: HTTP POST /api/readings {"device_id":"step-safe-esp32", "fsr":20, "temperature":32.5}</text>

  <!-- 32. Flask status_for resets to NORMAL -->
  <path d="M 510 1170 L 550 1170 L 550 1190 L 510 1190" class="msg-line" stroke="#16a34a" marker-end="url(#syncArrow)"/>
  <text x="560" y="1184" class="msg-text" fill="#16a34a">32: Flask status_for() resets status="NORMAL", pressure_seconds=0</text>

  <!-- 33. Dashboard polls /api/live & updates UI -->
  <line x1="290" y1="1205" x2="510" y2="1205" class="msg-line" stroke="#16a34a" marker-end="url(#syncArrow)"/>
  <text x="400" y="1199" class="msg-text" fill="#16a34a" text-anchor="middle">33: GET /api/live =&gt; {status: "NORMAL", pressure_seconds: 0}</text>

  <line x1="290" y1="1220" x2="100" y2="1220" class="reply-line" marker-end="url(#replyArrow)"/>
  <text x="195" y="1214" class="reply-text" text-anchor="middle">34: clear alert banner, reset 30s horizontal timer bar</text>

</svg>