<svg xmlns="http://www.w3.org/2000/svg"
     width="1740"
     height="1320"
     viewBox="0 0 1740 1320">

  <!-- =====================================================
       DEFINITIONS & STYLES
       ===================================================== -->
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #475569; text-anchor: middle; }
      .obj-box { rx: 12px; stroke-width: 2; }
      .obj-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-decoration: underline; fill: #0f172a; text-anchor: middle; }
      .obj-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .obj-body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #334155; }
      .comm-link { stroke: #334155; stroke-width: 2.2; fill: none; }
      .comm-link-alert { stroke: #dc2626; stroke-width: 2.2; fill: none; }
      .comm-link-notif { stroke: #7c3aed; stroke-width: 2; fill: none; }
      .msg-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 11.5px; font-weight: bold; fill: #0f172a; }
      .msg-alert { font-family: 'Consolas', 'Courier New', monospace; font-size: 11.5px; font-weight: bold; fill: #dc2626; }
      .msg-notif { font-family: 'Consolas', 'Courier New', monospace; font-size: 11.5px; font-weight: bold; fill: #7c3aed; }
      .legend-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #334155; }
    </style>

    <marker id="arrow"
            markerWidth="9"
            markerHeight="9"
            refX="8"
            refY="4.5"
            orient="auto">
      <path d="M 0 1 L 8 4.5 L 0 8 Z" fill="#0f172a"/>
    </marker>

    <marker id="alertArrow"
            markerWidth="9"
            markerHeight="9"
            refX="8"
            refY="4.5"
            orient="auto">
      <path d="M 0 1 L 8 4.5 L 0 8 Z" fill="#dc2626"/>
    </marker>

    <marker id="notifArrow"
            markerWidth="9"
            markerHeight="9"
            refX="8"
            refY="4.5"
            orient="auto">
      <path d="M 0 1 L 8 4.5 L 0 8 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1740" height="1320" fill="#ffffff"/>

  <!-- Titles -->
  <text x="870" y="42" class="title">STEP-SAFE — COMMUNICATION DIAGRAM</text>
  <text x="870" y="68" class="subtitle">Numbered Inter-Object Collaboration: Calibration Sampling, Live Streaming, 30s Buzzer Trigger, and Mobile Notifications</text>

  <!-- =====================================================
       COMMUNICATION LINKS (LINES CONNECTING OBJECTS)
       ===================================================== -->

  <!-- 1. Patient <-> Dashboard -->
  <line x1="260" y1="210" x2="440" y2="210" class="comm-link"/>

  <!-- 2. Dashboard <-> FlaskBackend -->
  <line x1="720" y1="210" x2="900" y2="210" class="comm-link"/>

  <!-- 3. Caregiver <-> Dashboard -->
  <line x1="260" y1="440" x2="440" y2="280" class="comm-link"/>

  <!-- 4. FlaskBackend <-> SQLiteDatabase -->
  <line x1="1040" y1="290" x2="1040" y2="520" class="comm-link"/>

  <!-- 5. FlaskBackend <-> AlertService -->
  <line x1="1180" y1="210" x2="1340" y2="210" class="comm-link-alert"/>

  <!-- 6. AlertService <-> SQLiteDatabase -->
  <path d="M 1480 290 L 1480 430 L 1180 570" class="comm-link"/>

  <!-- 7. AlertService <-> MobileNotificationService -->
  <line x1="1480" y1="290" x2="1480" y2="520" class="comm-link-notif"/>

  <!-- 8. MobileNotificationService -> Patient -->
  <path d="M 1340 590 L 140 590 L 140 280" class="comm-link-notif"/>

  <!-- 9. MobileNotificationService -> Caregiver -->
  <line x1="1340" y1="620" x2="260" y2="470" class="comm-link-notif"/>

  <!-- 10. ESP32 <-> FlaskBackend -->
  <line x1="680" y1="840" x2="960" y2="290" class="comm-link"/>

  <!-- 11. ESP32 <-> FSR -->
  <line x1="440" y1="890" x2="270" y2="890" class="comm-link"/>

  <!-- 12. ESP32 <-> LM35 -->
  <line x1="440" y1="940" x2="270" y2="1090" class="comm-link"/>

  <!-- 13. ESP32 <-> Buzzer -->
  <line x1="720" y1="920" x2="920" y2="920" class="comm-link-alert"/>

  <!-- =====================================================
       OBJECTS (RECTANGULAR COMPARTMENTS)
       ===================================================== -->

  <!-- Object 1: :Patient -->
  <g id="obj-patient" transform="translate(60, 140)">
    <rect width="200" height="140" rx="10" fill="#f8fafc" stroke="#334155" class="obj-box"/>
    <text x="100" y="32" class="obj-title">:Patient</text>
    <text x="100" y="50" class="obj-sub">PatientProfile</text>
    <line x1="15" y1="62" x2="185" y2="62" stroke="#cbd5e1"/>
    <text x="20" y="82" class="obj-body">• Wears monitored foot insole</text>
    <text x="20" y="100" class="obj-body">• Starts 20-sample calibration</text>
    <text x="20" y="118" class="obj-body">• Receives local buzzer &amp; push</text>
  </g>

  <!-- Object 2: :Caregiver -->
  <g id="obj-caregiver" transform="translate(60, 390)">
    <rect width="200" height="135" rx="10" fill="#f8fafc" stroke="#334155" class="obj-box"/>
    <text x="100" y="32" class="obj-title">:Caregiver</text>
    <text x="100" y="50" class="obj-sub">CaregiverProfile</text>
    <line x1="15" y1="62" x2="185" y2="62" stroke="#cbd5e1"/>
    <text x="20" y="82" class="obj-body">• Assigned to Patient01</text>
    <text x="20" y="100" class="obj-body">• Monitors live telemetry</text>
    <text x="20" y="118" class="obj-body">• Receives alert notifications</text>
  </g>

  <!-- Object 3: :Dashboard -->
  <g id="obj-dashboard" transform="translate(440, 130)">
    <rect width="280" height="160" rx="10" fill="#eff6ff" stroke="#2563eb" class="obj-box"/>
    <text x="140" y="32" class="obj-title">:Dashboard</text>
    <text x="140" y="50" class="obj-sub">WebDashboard (Desktop &amp; Mobile)</text>
    <line x1="15" y1="62" x2="265" y2="62" stroke="#bfdbfe"/>
    <text x="20" y="82" class="obj-body">• Displays live FSR &amp; Temp gauges</text>
    <text x="20" y="100" class="obj-body">• Renders 30s horizontal timer progress bar</text>
    <text x="20" y="118" class="obj-body">• Shows baselines &amp; threshold cards</text>
    <text x="20" y="136" class="obj-body">• Triggers calibration POST /api/calibrate</text>
  </g>

  <!-- Object 4: :FlaskBackend -->
  <g id="obj-flask" transform="translate(900, 120)">
    <rect width="280" height="170" rx="10" fill="#eff6ff" stroke="#1d4ed8" class="obj-box"/>
    <text x="140" y="32" class="obj-title">:FlaskBackend</text>
    <text x="140" y="50" class="obj-sub">Flask REST Server @ 192.168.4.2:5000</text>
    <line x1="15" y1="62" x2="265" y2="62" stroke="#93c5fd"/>
    <text x="20" y="82" class="obj-body">• Handles POST /api/readings</text>
    <text x="20" y="100" class="obj-body">• Computes 20-sample baselines &amp; thr</text>
    <text x="20" y="118" class="obj-body">• Calculates status &amp; pressure duration</text>
    <text x="20" y="136" class="obj-body">• Evaluates temperature elevated state</text>
    <text x="20" y="154" class="obj-body">• Persists readings &amp; events to SQLite</text>
  </g>

  <!-- Object 5: :AlertService -->
  <g id="obj-alertsvc" transform="translate(1340, 130)">
    <rect width="280" height="160" rx="10" fill="#fef2f2" stroke="#dc2626" class="obj-box"/>
    <text x="140" y="32" class="obj-title" fill="#991b1b">:AlertService</text>
    <text x="140" y="50" class="obj-sub" fill="#dc2626">Alert Management Service</text>
    <line x1="15" y1="62" x2="265" y2="62" stroke="#fca5a5"/>
    <text x="20" y="82" class="obj-body">• Instantiates HIGH PRESSURE alert</text>
    <text x="20" y="100" class="obj-body">• Instantiates HIGH RISK alert</text>
    <text x="20" y="118" class="obj-body">• Commits alert to events table</text>
    <text x="20" y="136" class="obj-body">• Dispatches mobile notification task</text>
  </g>

  <!-- Object 6: :MobileNotificationService -->
  <g id="obj-notifsvc" transform="translate(1340, 520)">
    <rect width="320" height="150" rx="10" fill="#faf5ff" stroke="#7c3aed" class="obj-box"/>
    <text x="160" y="30" class="obj-title" fill="#5b21b6">:MobileNotificationService</text>
    <text x="160" y="48" class="obj-sub" fill="#7c3aed">Firebase / APNs Push API</text>
    <line x1="15" y1="58" x2="305" y2="58" stroke="#ddd6fe"/>
    <text x="20" y="78" class="obj-body" fill="#6d28d9">• Cloud Push Notification Gateway</text>
    <text x="20" y="96" class="obj-body" fill="#6d28d9">• Dispatches push to Patient mobile profile</text>
    <text x="20" y="114" class="obj-body" fill="#6d28d9">• Dispatches push to Caregiver profile</text>
    <text x="20" y="132" class="obj-body" fill="#6d28d9">• High pressure &amp; high risk notification</text>
  </g>

  <!-- Object 7: :SQLiteDatabase -->
  <g id="obj-sqlite" transform="translate(900, 520)">
    <rect width="280" height="150" rx="10" fill="#f8fafc" stroke="#475569" class="obj-box"/>
    <text x="140" y="32" class="obj-title">:SQLiteDatabase</text>
    <text x="140" y="50" class="obj-sub">step_safe.db (MacBook Storage)</text>
    <line x1="15" y1="62" x2="265" y2="62" stroke="#cbd5e1"/>
    <text x="20" y="82" class="obj-body">• Stores readings (fsr, temp, time)</text>
    <text x="20" y="100" class="obj-body">• Stores baselines &amp; threshold values</text>
    <text x="20" y="118" class="obj-body">• Stores events (alert logs &amp; peaks)</text>
    <text x="20" y="136" class="obj-body">• Stores users, profiles &amp; device map</text>
  </g>

  <!-- Object 8: :ESP32 -->
  <g id="obj-esp32" transform="translate(440, 810)">
    <rect width="280" height="190" rx="10" fill="#f0fdf4" stroke="#16a34a" class="obj-box"/>
    <text x="140" y="32" class="obj-title" fill="#15803d">:ESP32</text>
    <text x="140" y="50" class="obj-sub">ESP32Controller (SoftAP: 192.168.4.1)</text>
    <line x1="15" y1="62" x2="265" y2="62" stroke="#bbf7d0"/>
    <text x="20" y="82" class="obj-body">• Samples FSR on GPIO 34 (ADC1)</text>
    <text x="20" y="100" class="obj-body">• Samples LM35 on GPIO 35 (ADC1)</text>
    <text x="20" y="118" class="obj-body">• Tracks 30s sustained pressure timer</text>
    <text x="20" y="136" class="obj-body">• Controls Buzzer on GPIO 25</text>
    <text x="20" y="154" class="obj-body">• Creates STEP-SAFE local Wi-Fi AP</text>
    <text x="20" y="172" class="obj-body">• Sends POST /api/readings (fsr, temp)</text>
  </g>

  <!-- Object 9: :FSR -->
  <g id="obj-fsr" transform="translate(50, 830)">
    <rect width="220" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" class="obj-box"/>
    <text x="110" y="32" class="obj-title" fill="#15803d">:FSR</text>
    <text x="110" y="50" class="obj-sub">FSRPressureSensor (GPIO 34)</text>
    <line x1="15" y1="62" x2="205" y2="62" stroke="#bbf7d0"/>
    <text x="15" y="80" class="obj-body">• 10 kΩ voltage divider</text>
    <text x="15" y="98" class="obj-body">• Reads raw ADC foot pressure</text>
  </g>

  <!-- Object 10: :LM35 -->
  <g id="obj-lm35" transform="translate(50, 1010)">
    <rect width="220" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" class="obj-box"/>
    <text x="110" y="32" class="obj-title" fill="#15803d">:LM35</text>
    <text x="110" y="50" class="obj-sub">LM35TemperatureSensor (GPIO 35)</text>
    <line x1="15" y1="62" x2="205" y2="62" stroke="#bbf7d0"/>
    <text x="15" y="80" class="obj-body">• Linear 10 mV/°C analog out</text>
    <text x="15" y="98" class="obj-body">• Reads foot temperature in °C</text>
  </g>

  <!-- Object 11: :Buzzer -->
  <g id="obj-buzzer" transform="translate(920, 840)">
    <rect width="250" height="130" rx="10" fill="#fef2f2" stroke="#dc2626" class="obj-box"/>
    <text x="125" y="32" class="obj-title" fill="#991b1b">:Buzzer</text>
    <text x="125" y="50" class="obj-sub" fill="#dc2626">Buzzer Alert (GPIO 25)</text>
    <line x1="15" y1="62" x2="235" y2="62" stroke="#fca5a5"/>
    <text x="15" y="82" class="obj-body">• Active piezo buzzer alarm</text>
    <text x="15" y="100" class="obj-body">• Activated after 30s sustained pressure</text>
    <text x="15" y="118" class="obj-body">• Auto-turns OFF on pressure release</text>
  </g>

  <!-- =====================================================
       NUMBERED COLLABORATION MESSAGES ALONG LINKS
       (Updated: ESP32 sends only device_id, fsr, temperature)
       ===================================================== -->

  <!-- Between Patient & Dashboard -->
  <path d="M 280 195 L 420 195" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="350" y="188" class="msg-text" text-anchor="middle">1.0: login()</text>

  <path d="M 280 225 L 420 225" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="350" y="240" class="msg-text" text-anchor="middle">2.0: startCalibration()</text>

  <path d="M 420 260 L 280 260" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="350" y="275" class="msg-text" text-anchor="middle">8.0: renderLiveReadings()</text>

  <!-- Between Dashboard & FlaskBackend -->
  <path d="M 740 195 L 880 195" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="810" y="188" class="msg-text" text-anchor="middle">2.1: POST /api/calibrate</text>

  <path d="M 740 225 L 880 225" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="810" y="240" class="msg-text" text-anchor="middle">7.0: GET /api/live (fetch status/timer)</text>

  <path d="M 880 255 L 740 255" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="810" y="270" class="msg-text" text-anchor="middle">7.1: {reading, status, timer}</text>

  <!-- Between Caregiver & Dashboard -->
  <path d="M 270 420 L 430 300" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="340" y="350" class="msg-text" text-anchor="middle">8.1: viewPatientHistory()</text>

  <!-- Between ESP32 & Sensors -->
  <!-- FSR -->
  <path d="M 420 880 L 290 880" stroke="#15803d" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="355" y="872" class="msg-text" fill="#15803d" text-anchor="middle">3.0: readADC(GPIO34)</text>

  <path d="M 290 905 L 420 905" stroke="#15803d" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="355" y="920" class="msg-text" fill="#15803d" text-anchor="middle">3.1: pressureVal</text>

  <!-- LM35 -->
  <path d="M 420 965 L 290 1060" stroke="#15803d" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="350" y="1005" class="msg-text" fill="#15803d" text-anchor="middle">4.0: readADC(GPIO35)</text>

  <path d="M 290 1080 L 420 990" stroke="#15803d" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="380" y="1045" class="msg-text" fill="#15803d" text-anchor="middle">4.1: tempCelsius</text>

  <!-- Between ESP32 & FlaskBackend (Updated: only device_id, fsr, temperature) -->
  <path d="M 720 780 L 890 320" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="820" y="550" class="msg-text" text-anchor="middle">5.0: POST /api/readings {"device_id","fsr","temperature"}</text>
  <text x="820" y="570" class="msg-text" text-anchor="middle">6.0: POST /api/readings (continuous stream: 1000ms)</text>
  <text x="820" y="590" class="msg-alert" text-anchor="middle">9.0: POST /api/readings {"device_id":"step-safe-esp32","fsr":680,"temperature":33.0}</text>

  <!-- Between FlaskBackend & SQLiteDatabase -->
  <path d="M 1025 310 L 1025 500" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="1035" y="415" class="msg-text">5.1: saveCalibration()</text>
  <text x="1035" y="435" class="msg-text">6.1: insertReading(fsr, temp, status, timer)</text>

  <!-- Between ESP32 & Buzzer -->
  <path d="M 740 905 L 900 905" stroke="#dc2626" stroke-width="1.5" marker-end="url(#alertArrow)"/>
  <text x="820" y="895" class="msg-alert" text-anchor="middle">10.0: setGPIO25(HIGH) [30s sustained]</text>

  <path d="M 900 935 L 740 935" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="820" y="955" class="msg-text" fill="#15803d" text-anchor="middle">14.0: setGPIO25(LOW) [pressure release]</text>

  <!-- Between FlaskBackend & AlertService -->
  <path d="M 1200 200 L 1320 200" stroke="#dc2626" stroke-width="1.5" marker-end="url(#alertArrow)"/>
  <text x="1260" y="190" class="msg-alert" text-anchor="middle">11.0: createAlert()</text>
  <text x="1260" y="235" class="msg-text" fill="#475569" text-anchor="middle">(Flask evaluates status &amp; timer)</text>

  <!-- Between AlertService & SQLiteDatabase -->
  <path d="M 1360 310 L 1190 530" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="1285" y="430" class="msg-text" text-anchor="middle">11.1: INSERT INTO events</text>

  <!-- Between AlertService & MobileNotificationService -->
  <path d="M 1495 310 L 1495 500" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#notifArrow)"/>
  <text x="1505" y="405" class="msg-notif">12.0: sendMobileAlert()</text>
  <text x="1505" y="425" class="msg-notif">(Firebase / APNs API)</text>

  <!-- Between MobileNotificationService & Patient / Caregiver -->
  <path d="M 1320 580 L 280 580" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#notifArrow)"/>
  <text x="760" y="572" class="msg-notif" text-anchor="middle">12.1: pushNotification("High Pressure (32s). Check STEP-SAFE dashboard.")</text>

  <path d="M 1320 630 L 280 490" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#notifArrow)"/>
  <text x="760" y="620" class="msg-notif" text-anchor="middle">12.2: pushNotification("Patient Alert: High Pressure")</text>

  <!-- =====================================================
       DIAGRAM LEGEND & FOOTNOTE
       ===================================================== -->
  <g transform="translate(60, 1170)">
    <rect width="1620" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="25" y="24" font-family="'Segoe UI', Arial" font-size="13" font-weight="bold" fill="#0f172a">COMMUNICATION SEQUENCE FLOW SUMMARY:</text>
    <text x="25" y="46" class="legend-text">
      • <tspan font-weight="bold">1.0 - 2.1:</tspan> Patient authenticates and triggers 20-sample calibration from Dashboard to Flask.
      • <tspan font-weight="bold">3.0 - 5.1:</tspan> ESP32 reads FSR (GPIO 34) &amp; LM35 (GPIO 35), sends {device_id, fsr, temp} to Flask; Flask calculates &amp; saves Baselines/Thresholds in SQLite.
    </text>
    <text x="25" y="66" class="legend-text">
      • <tspan font-weight="bold">6.0 - 8.1:</tspan> ESP32 streams raw telemetry to Flask; Flask calculates status and duration; Dashboard fetches live metrics from /api/live.
    </text>
    <text x="25" y="86" class="legend-text">
      • <tspan font-weight="bold">9.0 - 12.2:</tspan> On sustained pressure (&gt;=30s), ESP32 triggers Buzzer (GPIO 25 HIGH), Flask creates Alert, and Mobile Notification Service pushes alerts to Patient &amp; Caregiver.
    </text>
    <text x="25" y="104" class="legend-text">
      • <tspan font-weight="bold">14.0:</tspan> Foot pressure released =&gt; ESP32 deactivates Buzzer (GPIO 25 LOW), Flask resets timer to 0, status returns to NORMAL.
    </text>
  </g>

</svg>